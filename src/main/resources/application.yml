server:
  port: ${SERVER_PORT:33400}

app:
  kafka-topic: ${KAFKA_TOPIC:transactions}

incentive:
  # 外部激励服务的地址与超时（毫秒）
  base-url: ${INCENTIVE_BASE_URL:http://localhost:8080/incentive}
  connect-timeout-ms: ${INCENTIVE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INCENTIVE_READ_TIMEOUT_MS:3000}

spring:
  application:
    name: midas-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: midas-core-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 用 ErrorHandlingDeserializer 包一层：反序列化失败会被包装成可处理异常，
      # 交给 ErrorHandler 重试/进死信，而不是让消费线程在坏消息上无限重试、卡死分区
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
        # 上游外部系统通常只发裸 JSON（无 __TypeId__ 头），这里指定默认目标类型
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
