# 本地开发：H2 内存库，重启即清空；schema 由 Hibernate 生成，不走 Flyway
spring:
  datasource:
    url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

logging:
  level:
    com.jpmc.midascore: INFO
