server:
  port: ${SERVER_PORT:33400}

app:
  kafka-topic: ${KAFKA_TOPIC:transactions}

incentive:
  # 外部激励服务的地址与超时（毫秒）
  base-url: ${INCENTIVE_BASE_URL:http://localhost:8080/incentive}
  connect-timeout-ms: ${INCENTIVE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${INCENTIVE_READ_TIMEOUT_MS:3000}

spring:
  application:
    name: midas-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: midas-core-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
